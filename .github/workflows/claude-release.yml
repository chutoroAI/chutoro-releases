name: Claude Code client release

on:
  push:
    tags: ['claude-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: chutoroAI/chutoro
          ref: ${{ github.ref_name }}
          token: ${{ secrets.DELIVERY_SOURCE_TOKEN }}
          persist-credentials: false
          path: source
      - run: python3 -m unittest discover -s source/scripts/tests -p 'test_claude*.py'
      - run: python3 scripts/package_claude.py source dist "${GITHUB_REF_NAME#claude-v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-client
          path: dist/*
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: claude-client
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "Chutoro for Claude Code ${GITHUB_REF_NAME#claude-v}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
